<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pupil Practice Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #fdf6e3; text-align: center; padding: 40px; }
    .card { background: white; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    label { display: block; margin: 12px 0 4px; text-align: left; }
    input, select { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 10px 20px; border: none; border-radius: 8px; background: #2a9d8f; color: white; font-size: 16px; cursor: pointer; }
    a { display: block; margin-top: 16px; color: #e76f51; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Pupil Practice Portal</h1>
    <form action="{% url 'quiz' %}" method="post">
      {% csrf_token %}
      <label for="pupil_name">Your name</label>
      <input type="text" id="pupil_name" name="pupil_name" required>

      <label for="subject">Subject</label>
      <select id="subject" name="subject">
        <option value="maths">Maths</option>
        <option value="english">English</option>
      </select>

      <label for="difficulty">Difficulty</label>
      <select id="difficulty" name="difficulty">
        <option value="easy">Easy</option>
        <option value="hard">Hard</option>
      </select>

      <button type="submit">Start Practice</button>
    </form>
    <a href="{% url 'history' %}">View Past Results</a>
  </div>
</body>
</html>
